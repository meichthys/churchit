exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "church.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
        # Rendered by Frappe as a Jinja template, not literal JSON.
        exclude: ^churchit/www/manifest\.json$
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: local
    hooks:
      - id: source-header
        name: "Apply the freely-given source header"
        entry: python scripts/apply_source_header.py
        language: python
        types_or: [python, javascript]

      - id: build-manuals
        name: "Build the Manual workspaces from manual/"
        entry: python docs/build_manuals.py
        language: python
        files: ^(manual/|churchit/public/manual/)
        pass_filenames: false

      - id: manual-pictures
        name: "Name the manual pictures that a changed screen may make old"
        entry: python docs/screenshots.py --stale
        language: python
        files: ^churchit/[^/]+/(doctype|page|report)/.+\.(json|js|html|css)$
        verbose: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles. Frappe renders web
        # form scripts through Jinja, so list any that use it here.
        exclude: |
            (?x)^(
                churchit/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                churchit/templates/includes/.*|
                churchit/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles. Frappe renders web
        # form scripts through Jinja, so list any that use it here.
        exclude: |
            (?x)^(
                churchit/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                churchit/templates/includes/.*|
                churchit/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
