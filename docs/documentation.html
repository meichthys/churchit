<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Churchit Manual</title>
  <link rel="canonical" href="https://docs.churchit.app/manual" />
  <meta http-equiv="refresh" content="0; url=https://docs.churchit.app/manual" />
  <script>
    // The manual moved to docs.churchit.app. An old link to a section, such as #people-rolodex, opens its page there.
    var [folder, ...page] = location.hash.slice(1).split("-");
    location.replace("https://docs.churchit.app/manual" + (folder ? "/" + folder : "") + (page.length ? "/" + page.join("-") : ""));
  </script>
</head>
<body>
  <p>The Churchit manual is now at <a href="https://docs.churchit.app/manual">docs.churchit.app</a>.</p>
</body>
</html>
