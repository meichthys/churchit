# Builds the churchit image (frappe v15 + payments + churchit) and pushes it to
# GitHub Container Registry, so self-hosters only pull it — never build it.
#
# It builds with frappe_docker's official custom Containerfile
# (images/custom/Containerfile). That file pulls frappe from source via
# `bench init` and installs our extra apps from apps.json, which is passed as a
# BuildKit *secret* named "apps_json" (NOT a build-arg).
#
# frappe_docker is pinned to a commit so an upstream change can't break the
# build without warning. To update it: bump the `ref:` SHA below, then re-check
# that images/custom/Containerfile still expects the `apps_json` secret and the
# same build-args (upstream has changed both before).
#
# ── Upgrading Frappe (e.g. v15 → v16) ────────────────────────────────────────
# Version knobs are spread across the deploy setup. To move to a new version:
#   In THIS file:
#     - `branches: [version-15]` trigger        -> the new app branch
#     - build-arg `FRAPPE_BRANCH=version-15`     -> the new branch
#     - re-pin frappe_docker `ref:` to a commit whose images/custom/Containerfile
#       targets the new version, then re-verify the `apps_json` secret + arg names
#     - `PYTHON_VERSION` / `NODE_VERSION`: newer Frappe needs newer runtimes. The
#       Containerfile's own defaults will likely already be correct, so you can
#       probably DELETE these two overrides. Confirm against the target frappe's
#       `requires-python` (v15 was `>=3.10,<3.14`, hence our 3.12 pin).
#   Elsewhere in deploy/:
#     - apps.json          -> bump the `payments` and `churchit` branches
#     - setup.sh           -> `REF="version-15"` (drives the raw download URLs)
#     - docker-compose.yml -> recheck the `mariadb:10.6` / redis minimums
#     - make sure a matching `version-16` churchit branch actually exists first
name: build-image

on:
  push:
    branches: [version-15]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout churchit (for deploy/apps.json)
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (pinned)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: b3463711e5700934104a334cf4ea79cceadaa2bd
          path: frappe_docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # apps.json (payments + churchit) is consumed by the Containerfile as a
          # secret; the id MUST be "apps_json" to match its --mount=type=secret.
          secret-files: |
            apps_json=${{ github.workspace }}/deploy/apps.json
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
            # Override the Containerfile's v16 defaults for v15:
            # frappe v15 requires Python >=3.10,<3.14, and this app is proven on
            # Python 3.12 / Node 22 in the reference bench.
            PYTHON_VERSION=3.12
            NODE_VERSION=22.18.0
