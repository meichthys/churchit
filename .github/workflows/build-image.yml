# Builds the churchit image (frappe v16, churchit, and dependencies) and pushes it to
# GitHub Container Registry.
#
# It builds with frappe_docker's official custom Containerfile
# (images/custom/Containerfile). That file pulls frappe from source via
# `bench init` and installs our extra apps from apps.json, which is passed as a
# BuildKit *secret* named "apps_json" (NOT a build-arg).
#
# frappe_docker is pinned to a specific commit ref so an upstream change can't break the
# build without warning. To use a newer frappe_docker, we bump the `ref:` SHA below.

## Notes on upgrading to a new frappe major version
# Version knobs are spread across the deploy setup. To move to a new version:
#   In THIS file:
#     - `branches: [version-16]` trigger         -> the new app branch
#     - build-arg `FRAPPE_BRANCH=version-16`     -> the new branch
#     - re-pin frappe_docker `ref:` to a commit whose images/custom/Containerfile
#       targets the new version. Its PYTHON_VERSION / NODE_VERSION defaults then
#       match the new frappe; only add overrides if churchit needs something else.
#   Elsewhere in deploy/:
#     - apps.json          -> bump the `payments` and `churchit` branches
#     - setup.sh           -> `REF="version-16"` (drives the raw download URLs)
#     - README.md          -> the curl one-liner URL
#     - docker-compose.yml -> recheck the mariadb / redis versions against
#                             frappe_docker's overrides/compose.mariadb.yaml and
#                             overrides/compose.redis.yaml at the pinned ref
#     - make sure a matching `version-NN` branch for churchit exists and is up to date
name: build-image

on:
  push:
    branches: [version-16]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout churchit (for deploy/apps.json)
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (pinned)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: b3463711e5700934104a334cf4ea79cceadaa2bd
          path: frappe_docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # apps.json (payments + churchit) is consumed by the Containerfile as a
          # secret; the id MUST be "apps_json" to match its --mount=type=secret.
          secret-files: |
            apps_json=${{ github.workspace }}/deploy/apps.json
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
