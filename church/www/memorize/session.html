{% extends "templates/web.html" %}

{% block title %}{{ reference_label }} — Memorize{% endblock %}

{% block page_content %}
<div id="memorize-session" data-mode="{{ mode }}" data-item="{{ item_name }}">
    <header class="memorize-header">
        <a href="/memorize" class="memorize-back" title="Back to list">&larr;</a>
        <div class="memorize-meta">
            <div class="memorize-ref">{{ reference_label }}</div>
            <div class="memorize-progress">
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="progress-bar" style="width: {{ progress }}%;"></div>
                </div>
                <span id="progress-label">{{ progress }}%</span>
            </div>
        </div>
        <div class="memorize-controls" id="memorize-controls"></div>
    </header>

    <main class="memorize-stage">
        <div class="memorize-passage" id="memorize-passage"></div>
        <div class="memorize-hint" id="memorize-hint"></div>
    </main>

    <div class="memorize-banner" id="memorize-banner" hidden>
        <div class="memorize-banner-inner">
            <h2 id="banner-title">Session complete</h2>
            <p id="banner-detail"></p>
            <div class="memorize-banner-actions">
                <a href="/memorize" class="m-btn m-btn-primary">Back to list</a>
                <button id="banner-again" class="m-btn m-btn-outline">Practice again</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block style %}
<style>
    .page-header, .web-footer, .navbar, .breadcrumb-container, footer, .website-footer { display: none !important; }
    body { margin: 0; background: #0f1530; color: #e8eaf6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .page-content-wrapper, .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    .main-section { padding: 0 !important; }

    #memorize-session { display: flex; flex-direction: column; height: 100vh; }
    .memorize-header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #1a2150; border-bottom: 1px solid #2a356b; }
    .memorize-back { color: #cfd8ff; text-decoration: none; font-size: 22px; padding: 4px 12px; border-radius: 6px; }
    .memorize-back:hover { background: #2a356b; color: #fff; }
    .memorize-meta { flex: 1; min-width: 0; }
    .memorize-ref { font-weight: 600; font-size: 18px; }
    .memorize-progress { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: #b0b8d8; }
    .progress-bar-outer { width: 240px; height: 6px; background: #2a356b; border-radius: 3px; overflow: hidden; }
    .progress-bar-inner { height: 100%; background: linear-gradient(90deg, #4cc9f0, #7b61ff); transition: width 250ms ease; }
    .memorize-controls { display: flex; gap: 8px; }
    .memorize-controls button { background: #2a356b; color: #e8eaf6; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
    .memorize-controls button:hover { background: #3a4690; }
    .memorize-controls button[disabled] { opacity: 0.4; cursor: default; }

    .memorize-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
    .memorize-passage { max-width: 900px; font-size: 22px; line-height: 1.8; text-align: left; }
    .memorize-passage .tok { transition: filter 200ms ease, color 200ms ease, background 200ms ease; padding: 0 1px; border-radius: 3px; }
    .memorize-passage .tok-word.heat-1 { background: rgba(255, 170, 90, 0.12); }
    .memorize-passage .tok-word.heat-2 { background: rgba(255, 120, 90, 0.22); }
    .memorize-passage .tok-word.heat-3 { background: rgba(255, 80, 80, 0.36); }
    .memorize-passage .tok-word.current { outline: 2px solid #4cc9f0; outline-offset: 1px; }
    .memorize-passage .tok-word.done { color: #7be3a0; }
    .memorize-passage .tok-word.mistake-flash { color: #ff7676; }
    .memorize-passage .tok-word.blur-1 { filter: blur(2px); }
    .memorize-passage .tok-word.blur-2 { filter: blur(4px); }
    .memorize-passage .tok-word.blur-3 { filter: blur(7px); }
    .memorize-passage .tok-word.blur-4 { color: transparent; text-shadow: 0 0 8px rgba(232,234,246,0.7); }
    .memorize-hint { margin-top: 16px; min-height: 24px; color: #b0b8d8; font-size: 14px; }

    .memorize-banner { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); z-index: 999; }
    .memorize-banner-inner { background: #1a2150; padding: 28px 36px; border-radius: 10px; max-width: 480px; text-align: center; }
    .memorize-banner-inner h2 { margin-top: 0; color: #e8eaf6; }
    .memorize-banner-actions { margin-top: 18px; display: flex; justify-content: center; gap: 10px; }

    .m-btn { display: inline-block; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
    .m-btn-primary { background: #4a6cf7; color: #fff; }
    .m-btn-primary:hover { background: #3a5ce0; color: #fff; text-decoration: none; }
    .m-btn-outline { background: transparent; color: #cfd8ff; border-color: #cfd8ff; }
    .m-btn-outline:hover { background: rgba(207, 216, 255, 0.1); color: #fff; }
</style>
{% endblock %}

{% block script %}
<script>
(function() {
    const TEXT = {{ reference_text|tojson }};
    const MODE = "{{ mode }}";
    const ITEM = "{{ item_name }}";
    const INITIAL_PROGRESS = {{ progress }};
    let WORD_MISTAKES = {};
    try { WORD_MISTAKES = JSON.parse({{ word_mistakes_json|tojson }}) || {}; } catch (e) { WORD_MISTAKES = {}; }

    const passageEl = document.getElementById("memorize-passage");
    const hintEl = document.getElementById("memorize-hint");
    const controlsEl = document.getElementById("memorize-controls");
    const bannerEl = document.getElementById("memorize-banner");
    const bannerTitle = document.getElementById("banner-title");
    const bannerDetail = document.getElementById("banner-detail");
    const progressBar = document.getElementById("progress-bar");
    const progressLabel = document.getElementById("progress-label");

    // --- Tokenization -------------------------------------------------------
    // Word = anything containing a letter. Verse numbers (e.g. "16.") and
    // pure punctuation are skipped during typing/blur but kept in the layout.
    function tokenize(text) {
        const tokens = [];
        let wordIndex = 0;
        const re = /\s+|[^\s]+/g;
        let m;
        while ((m = re.exec(text)) !== null) {
            const raw = m[0];
            if (/^\s+$/.test(raw)) {
                tokens.push({ raw, kind: "space" });
                continue;
            }
            if (/[A-Za-z]/.test(raw)) {
                const firstLetter = (raw.match(/[A-Za-z]/) || [""])[0].toLowerCase();
                tokens.push({ raw, kind: "word", wordIndex, firstLetter });
                wordIndex += 1;
            } else {
                tokens.push({ raw, kind: "punct" });
            }
        }
        return tokens;
    }

    function heatClass(count) {
        if (!count) return "";
        if (count === 1) return "heat-1";
        if (count === 2) return "heat-2";
        return "heat-3";
    }

    const tokens = tokenize(TEXT);
    const wordTokens = tokens.filter(t => t.kind === "word");
    const totalWords = wordTokens.length;

    function renderPassage() {
        const html = tokens.map(t => {
            if (t.kind === "space") return t.raw;
            if (t.kind === "punct") return `<span class="tok tok-punct">${escapeHtml(t.raw)}</span>`;
            const heat = heatClass(WORD_MISTAKES[t.wordIndex] || 0);
            return `<span class="tok tok-word ${heat}" data-word-index="${t.wordIndex}">${escapeHtml(t.raw)}</span>`;
        }).join("");
        passageEl.innerHTML = html;
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function wordSpan(wordIndex) {
        return passageEl.querySelector(`.tok-word[data-word-index="${wordIndex}"]`);
    }

    function refreshHeat(wordIndex) {
        const el = wordSpan(wordIndex);
        if (!el) return;
        el.classList.remove("heat-1", "heat-2", "heat-3");
        const c = WORD_MISTAKES[wordIndex] || 0;
        const cls = heatClass(c);
        if (cls) el.classList.add(cls);
    }

    function updateProgress(value) {
        progressBar.style.width = Math.max(0, Math.min(100, value)) + "%";
        progressLabel.textContent = value + "%";
    }

    function applyBlurToWords(blurAmount) {
        // Apply blur to individual words, but not to words that have been typed correctly
        passageEl.querySelectorAll(".tok-word").forEach(el => {
            if (el.classList.contains("done")) {
                // Word was typed correctly - show it
                el.style.filter = "none";
            } else {
                // Word not yet typed - blur it
                el.style.filter = blurAmount > 0 ? `blur(${blurAmount}px)` : "none";
            }
        });
    }

    // --- Server calls -------------------------------------------------------
    let currentTypeState = null;  // Will be set by initWordType

    function recordMistake(wordIndex) {
        return frappe.call({
            method: "church.church_study.doctype.bible_memory_item.bible_memory_item.record_mistake",
            args: {
                name: ITEM,
                word_index: wordIndex,
            },
        }).then(r => {
            if (r && r.message) {
                updateProgress(r.message.progress);
                if (MODE === "type" && currentTypeState) {
                    currentTypeState.currentProgress = r.message.progress;
                    const blurAmount = Math.max(0, Math.min(20, (r.message.progress / 50) * 20));
                    applyBlurToWords(blurAmount);
                }
            }
        });
    }

    function completeSession(mistakes, correctIndices) {
        return frappe.call({
            method: "church.church_study.doctype.bible_memory_item.bible_memory_item.complete_session",
            args: {
                name: ITEM,
                mode: MODE,
                mistakes: mistakes,
                correct_word_indices: correctIndices,
            },
        }).then(r => {
            if (r && r.message) {
                updateProgress(r.message.progress);
                if (MODE === "type" && currentTypeState) {
                    currentTypeState.currentProgress = r.message.progress;
                    const blurAmount = Math.max(0, Math.min(20, (r.message.progress / 50) * 20));
                    applyBlurToWords(blurAmount);
                }
                showBanner(r.message);
            }
        });
    }

    function showBanner(result) {
        const parts = [];
        parts.push(`Progress: ${result.progress}%`);
        if (result.bonus) parts.push(`+${result.bonus} this session`);
        if (result.memorized) parts.push("Memorized!");
        bannerDetail.textContent = parts.join(" · ");
        bannerEl.hidden = false;
    }

    document.getElementById("banner-again").addEventListener("click", () => {
        window.location.reload();
    });

    // --- Word Type mode -----------------------------------------------------
    function initWordType() {
        renderPassage();
        const state = { idx: 0, mistakes: 0, correctIndices: new Set(), currentProgress: INITIAL_PROGRESS };
        currentTypeState = state;

        function highlightCurrent() {
            passageEl.querySelectorAll(".tok-word.current").forEach(el => el.classList.remove("current"));
            if (state.idx < totalWords) {
                const el = wordSpan(state.idx);
                if (el) {
                    el.classList.add("current");
                    el.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }
            const blurAmount = Math.max(0, Math.min(20, (state.currentProgress / 50) * 20));
            applyBlurToWords(blurAmount);
        }

        function fadeCorrect(wordIndex) {
            const el = wordSpan(wordIndex);
            if (!el) return;
            const current = WORD_MISTAKES[wordIndex] || 0;
            if (current > 0) {
                WORD_MISTAKES[wordIndex] = current - 1;
                if (WORD_MISTAKES[wordIndex] <= 0) delete WORD_MISTAKES[wordIndex];
            }
            refreshHeat(wordIndex);
            el.classList.add("done");
        }

        function flashMistake(wordIndex) {
            const el = wordSpan(wordIndex);
            if (!el) return;
            el.classList.add("mistake-flash");
            setTimeout(() => el.classList.remove("mistake-flash"), 350);
            WORD_MISTAKES[wordIndex] = (WORD_MISTAKES[wordIndex] || 0) + 1;
            refreshHeat(wordIndex);
        }

        function onKey(ev) {
            if (state.idx >= totalWords) return;
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const key = (ev.key || "").toLowerCase();
            if (!/^[a-z]$/.test(key)) return;
            ev.preventDefault();
            const target = wordTokens[state.idx];
            if (key === target.firstLetter) {
                fadeCorrect(target.wordIndex);
                state.correctIndices.add(target.wordIndex);
                state.idx += 1;
                highlightCurrent();
                if (state.idx >= totalWords) {
                    hintEl.textContent = "Saving session…";
                    completeSession(state.mistakes, [...state.correctIndices]);
                }
            } else {
                flashMistake(target.wordIndex);
                state.mistakes += 1;
                recordMistake(target.wordIndex);
            }
        }

        controlsEl.innerHTML = `<span class="text-muted" style="color:#b0b8d8;">Type the first letter of each word</span>`;
        hintEl.textContent = "Mistakes reduce the memorized by 2%. Three mistakes or less increases memorized by 10%. No mistakes increases memorized by 50%";
        highlightCurrent();
        document.addEventListener("keydown", onKey);
    }

    // --- Word Blur mode -----------------------------------------------------
    function initWordBlur() {
        renderPassage();
        // Per-word blur level 0-4. Track stack of step deltas for back-step.
        const levels = new Array(totalWords).fill(0);
        const history = []; // each entry: array of word indices increased in that step

        function applyLevels() {
            wordTokens.forEach((t, i) => {
                const el = wordSpan(t.wordIndex);
                if (!el) return;
                el.classList.remove("blur-1", "blur-2", "blur-3", "blur-4");
                if (levels[i] > 0) el.classList.add(`blur-${Math.min(4, levels[i])}`);
            });
        }

        function increase() {
            const candidates = [];
            wordTokens.forEach((t, i) => {
                if (levels[i] < 4) candidates.push(i);
            });
            if (candidates.length === 0) return;
            const stepSize = Math.max(1, Math.ceil(totalWords / 6));
            const picks = [];
            for (let n = 0; n < stepSize && candidates.length > 0; n++) {
                const j = Math.floor(Math.random() * candidates.length);
                const idx = candidates.splice(j, 1)[0];
                levels[idx] += 1;
                picks.push(idx);
            }
            history.push(picks);
            applyLevels();
        }

        function backStep() {
            const last = history.pop();
            if (!last) return;
            last.forEach(i => { levels[i] = Math.max(0, levels[i] - 1); });
            applyLevels();
        }

        function reset() {
            for (let i = 0; i < levels.length; i++) levels[i] = 0;
            history.length = 0;
            applyLevels();
        }

        controlsEl.innerHTML = `
            <button id="blur-reveal" title="Click to reveal entire verse" style="font-size:24px;padding:6px 12px;">👀</button>
            <button id="blur-back" title="Undo last step">- Decrease Blur</button>
            <button id="blur-plus" title="Hide more words">+ Increase Blur</button>
            <div style="width:8px;"></div>
            <button id="blur-reset" title="Reset">Reset</button>
            <button id="blur-done" title="Save +5 progress" class="btn-primary" style="background:#4cc9f0;color:#0f1530;font-weight:600;">Done</button>
        `;
        hintEl.textContent = "Tap 👀 to reveal entire verse. Tap + to hide more words. Tap Done to save +5 progress (capped at 99).";

        const revealBtn = document.getElementById("blur-reveal");
        const setReveal = (on) => {
            passageEl.classList.toggle("reveal-all", on);
            if (on) {
                wordTokens.forEach((t) => {
                    const el = wordSpan(t.wordIndex);
                    if (el) {
                        el.classList.remove("blur-1", "blur-2", "blur-3", "blur-4");
                        el.style.filter = "none";
                        el.style.color = "";
                        el.style.textShadow = "";
                    }
                });
            } else {
                applyLevels();
            }
        };
        revealBtn.addEventListener("pointerdown", () => setReveal(true));
        revealBtn.addEventListener("pointerup", () => setReveal(false));
        revealBtn.addEventListener("pointerleave", () => setReveal(false));
        revealBtn.addEventListener("pointercancel", () => setReveal(false));

        document.getElementById("blur-plus").addEventListener("click", increase);
        document.getElementById("blur-back").addEventListener("click", backStep);
        document.getElementById("blur-reset").addEventListener("click", reset);
        document.getElementById("blur-done").addEventListener("click", () => {
            hintEl.textContent = "Saving session…";
            completeSession(0, []);
        });
    }

    // --- Bootstrap ----------------------------------------------------------
    if (!TEXT || !totalWords) {
        passageEl.innerHTML = `<div style="text-align:center;color:#b0b8d8;">No passage text available. Try again from <a href="/memorize">your list</a>.</div>`;
        return;
    }

    if (MODE === "type") initWordType();
    else if (MODE === "blur") initWordBlur();
})();
</script>
{% endblock %}
