{% extends "templates/web.html" %}

{% block title %}{{ title | e }}{% endblock %}
{% block header %}<h1>{{ title | e }}</h1>{% endblock %}

{% block head_include %}
<style>
	.live-player { max-width: 1100px; margin: 1.5rem auto; aspect-ratio: 16 / 9; }
	/* A player's error page sets no background, so in dark mode the browser painted it white.
	   With the light scheme of such a page the frame stays clear and shows the theme surface. */
	.live-player iframe { width: 100%; height: 100%; border: 0; border-radius: 0.375rem; color-scheme: light; background: var(--control-bg); }
</style>
{% endblock %}

{% block page_content %}
<div class="live-player">
	<iframe src="{{ embed_url | e }}" title="{{ church_name | e }}"
		allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
{% endblock %}
