{% extends "templates/web.html" %}

{% block title %}{{ doc.function_name | e }}{% endblock %}

{% block head_include %}
<style>
	.digital-bulletin-links { display: flex; flex-wrap: wrap; gap: 8px; max-width: 48rem; margin: 1.5rem auto 16px; }
	.digital-bulletin .bulletin-sheet { margin: 0 auto 24px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
	.digital-bulletin .bulletin-cut, .digital-bulletin .bulletin-panel.right.handout { display: none; }
	{#- The sheet stays white in dark mode, so it keeps the print colors over the dark theme's light links and headings. #}
	[data-theme="dark"] .digital-bulletin .cover-title,
	[data-theme="dark"] .digital-bulletin .bulletin-sheet a { color: #2a4a85; }
	{#- The printed sheet folds in half, so a screen reads the panels one after another, front cover first. #}
	@media screen {
		.digital-bulletin .bulletin-sheet { width: auto; max-width: 48rem; height: auto; display: flex; flex-direction: column; }
		.digital-bulletin .bulletin-panel,
		.digital-bulletin .cover-verse,
		.digital-bulletin .back-footer { position: static; width: auto; height: auto; }
		.digital-bulletin .bulletin-panel { padding: 24px 16px; }
		.digital-bulletin .bulletin-sheet:first-child .bulletin-panel.right { order: -1; }
		.digital-bulletin .cover-verse, .digital-bulletin .back-footer { margin-top: 16px; }
		.digital-bulletin img { max-width: 100%; }
	}
</style>
{% endblock %}

{% block page_content %}
<div class="digital-bulletin-links">
	<a class="btn btn-default btn-sm" href="/bulletins">{{ _("All bulletins") }}</a>
	<a class="btn btn-default btn-sm" href="/api/method/churchit.church_communications.doctype.bulletin.bulletin.download_pdf?name={{ doc.name | urlencode }}">{{ _("Download PDF") }}</a>
</div>
<div class="digital-bulletin">
	{% include "churchit/templates/print_formats/bulletin.html" %}
</div>
{% endblock %}
